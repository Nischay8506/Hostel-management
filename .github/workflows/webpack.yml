name: Cityhive validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cityhive
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: cityhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cityhive -d cityhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: isolated-ci-secret-with-more-than-thirty-two-characters
      ADMIN_PASSWORD: IsolatedOwnerPassword123!
      APP_ENVIRONMENT: test
      JOBS_ENABLED: 'false'
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cityhive:disposable-ci-password@localhost:5432/cityhive_test' || 'sqlite://' }}
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://cityhive:disposable-ci-password@localhost:5432/cityhive_test' || 'sqlite://' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - if: matrix.database == 'postgres'
        run: python -m alembic upgrade head
      - run: python -m pytest -q
